# =====================================================================
# SonarQube - proyecto1
# ---------------------------------------------------------------------
# Flujo completo de analisis (codigo + cobertura + quality gate):
#   1) Definir el token (una sola vez por sesion de terminal):
#        Windows:  set SONAR_TOKEN=su_token_aqui
#        Linux/Mac: export SONAR_TOKEN=su_token_aqui
#      Token nuevo: SonarQube > My Account > Security > Generate Tokens
#   2) composer sonar
#
# Solo correr tests con cobertura local: composer test:coverage
# =====================================================================

sonar.projectKey=proyecto1
sonar.projectName=Proyecto 1
sonar.host.url=http://localhost:9000
sonar.sourceEncoding=UTF-8

# Linea base: el "codigo nuevo" del quality gate se mide contra la version
# anterior distinta de la actual. Cambiar este numero en cada liberacion
# (o hito) reinicia la ventana de codigo nuevo desde ese punto.
sonar.projectVersion=2.0

# Codigo fuente a analizar
sonar.sources=app,bootstrap,config,database,routes,resources,public/css,tests

# Reportes generados por composer sonar
sonar.php.coverage.reportPaths=coverage.xml
sonar.php.tests.reportPaths=build/logs/junit.xml

# La cobertura se mide sobre la logica de la app (app/), no sobre vistas,
# configs ni migraciones, que no son ejecutadas por los tests directamente.
sonar.coverage.exclusions=resources/views/**,config/**,database/**,routes/**,public/css/**
